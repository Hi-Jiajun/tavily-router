# tavily-router 入口：只放行业务面，管理面留在 loopback
#
# 使用前替换：
#   <LAN_ADDR>  本机在局域网中的地址，例如 192.0.2.10（RFC 5737 文档地址）
#   <UPSTREAM_PORT>  路由器监听端口（默认 8080，仅 loopback）
# 参数依据见 docs/tuning.md：12 req/s 由"单 key ≈3 req/s"实测值随 key 数线性外推而来

# 限速区：按客户端 IP 计数；conf.d 内声明即在 http 作用域
limit_req_zone $binary_remote_addr zone=tavily_entry:10m rate=12r/s;

server {
    listen <LAN_ADDR>:8080;
    server_name _;

    client_max_body_size 16m;

    # 排队溢出时回 429（默认 503，对 MCP 客户端不友好）
    limit_req_status 429;

    # 管理面：局域网一律拒绝；需要时走 SSH 隧道
    location /api/ {
        return 403;
    }
    location /api {
        return 403;
    }

    location / {
        # 突发最多排队 120 个；不加 nodelay → 超出部分按 12r/s 排队放行而不是失败
        limit_req zone=tavily_entry burst=120;
        limit_req_log_level notice;

        proxy_pass http://127.0.0.1:<UPSTREAM_PORT>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # MCP 走 streamable HTTP / SSE：必须关缓冲并放宽读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
